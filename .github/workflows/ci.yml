name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

# The repository default for GITHUB_TOKEN is already read-only. Declaring it
# here keeps this job's authority explicit and independent of that setting.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the engines floor declared in package.json; 24 is what
        # development currently runs on. Testing both keeps the floor honest.
        node: [22, 24]
    steps:
      # Actions are pinned to commit SHAs rather than floating tags: a mutable
      # tag is a supply-chain hole. Dependabot updates SHA pins that carry a
      # version comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

  # What npm users get, proved from outside the workspace: every public
  # package packed as the release packs it, installed into an empty directory,
  # and the installed binary run there (scripts/pack-check.mjs). The test job
  # cannot see this; it runs from the checkout.
  pack:
    name: pack check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: node scripts/pack-check.mjs

      # What the Actions install: the published CLI from action-install's
      # lockfile, with registry signatures and provenance checked.
      - run: bash scripts/install-action-cli.sh
