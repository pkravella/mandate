name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

# The repository default for GITHUB_TOKEN is already read-only. Declaring it
# here keeps this job's authority explicit and independent of that setting.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the engines floor declared in package.json; 24 is what
        # development currently runs on. Testing both keeps the floor honest.
        node: [22, 24]
    steps:
      # Actions are pinned to commit SHAs rather than floating tags: a mutable
      # tag is a supply-chain hole. Dependabot updates SHA pins that carry a
      # version comment.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test
