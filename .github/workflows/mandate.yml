# Example: run an agent under a mandate.
#
# This workflow is an example and is deliberately NOT wired to a trigger that
# fires here — running an agent against a real repository is a decision each
# organization makes for itself. Copy it, set the trigger, and read the three
# notes below before you do.
name: Mandate (example)

on:
  workflow_dispatch:
    inputs:
      issue:
        description: The issue number to fix.
        required: true

# NOTE 1 — THE IMPORTANT LINE.
#
# The agent's authority must be the minted token and nothing else. An empty
# permissions block means GITHUB_TOKEN is not issued for this job at all, so
# there is no second credential for an injected agent to reach for. The action
# fails if it finds one anyway, because a mandate it cannot actually hold is
# worse than none: the audit log would claim a bound the run did not have.
permissions: {}

jobs:
  mandated-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Do not leave a credential in .git/config for the agent to use.
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: corepack enable && pnpm install --frozen-lockfile && pnpm build

      # NOTE 2 — NEVER INTERPOLATE UNTRUSTED TEXT INTO `agent`.
      #
      # `agent` is one argv element per line and the action never lets the shell
      # interpret a line, so a semicolon or a backtick in a line is an argument.
      # That protects the shell. It does NOT make the content safe as a *prompt*:
      # an issue title or body placed here is attacker-controlled text going
      # straight into the model's instructions.
      #
      # Mandate's answer to that is the mandate itself — an injected agent is
      # bounded by what was granted, which is the entire premise — but do not
      # confuse the two. If you pass issue text to the agent, pass it as data
      # the agent fetches through its granted read tools, not as instructions
      # spliced into the prompt. This example passes only a number.
      #
      # NOTE 3 — WHO MAY ASK.
      #
      # `--as` names the requester whose authority bounds the mandate, and
      # `repo` makes Mandate read that person's real permission from GitHub. On
      # a comment or issue trigger the person who wrote it is NOT automatically
      # entitled to ask: check that yourself before this step. R2 is that task
      # text and context arrive from an authorized source, and a drive-by
      # comment is not one.
      - uses: ./
        with:
          mandate: mandate.yaml
          ceiling: fixtures/ceilings/org-policy-v12.cedar
          schema: fixtures/ceilings/schema.cedarschema
          ceiling-destinations: fixtures/ceilings/org-policy-v12.destinations
          as: ${{ github.actor }}
          repo: ${{ github.repository }}
          agent: |
            claude
            --mcp-config
            {mcpConfig}
            -p
            Fix issue ${{ inputs.issue }} and open a pull request.
          app-id: ${{ secrets.MANDATE_APP_ID }}
          installation-id: ${{ secrets.MANDATE_INSTALLATION_ID }}
          private-key: ${{ secrets.MANDATE_APP_PRIVATE_KEY }}

      # The action graph is the audit record for the run: every call, its
      # decision, and the clause behind every refusal.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mandate-trace
          path: mandate-trace.jsonl
