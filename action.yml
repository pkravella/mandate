name: LeastPilot
description: >-
  Validate a task-scoped mandate against your organization's ceiling, then run
  an agent whose only GitHub authority is that mandate.
author: LeastPilot contributors

# TWO NOTES ON WHAT THIS FILE CANNOT DO
#
# 1. PERMISSIONS. The plan for this file said "the composite action must set
#    `permissions: {}` on its own job". An action cannot: `permissions` is a
#    workflow- and job-level key, and action metadata accepts only name,
#    description, author, inputs, outputs, runs and branding. GitHub ignores
#    anything else here. So the requirement belongs to the caller, the example
#    workflow sets it, and the first step below fails if a GITHUB_TOKEN reached
#    this job anyway — a token the agent could reach is authority LeastPilot did
#    not decide, which is the one property this project exists to provide.
#
# 2. SHELL INJECTION. Every value below is read from the environment inside the
#    run steps, never interpolated into the script body with ${{ }}. That is
#    not stylistic. A `${{ inputs.x }}` inside a `run:` block is substituted
#    into the script TEXT before bash sees it, so a value containing a quote or
#    a semicolon runs as a command. The first version of this file did exactly
#    that on every input, and the example workflow fed an issue title into the
#    `agent` input — which made a packaging layer whose purpose is containing an
#    agent's authority into a remote shell for anyone who could file an issue.
#
#    `agent` is therefore NEWLINE-SEPARATED, one argv element per line. A single
#    string would have to be word-split, and the only safe split (`read -ra`)
#    breaks a quoted prompt into separate arguments. One line per element is
#    unambiguous: spaces inside a line are kept, and nothing in a line is ever
#    interpreted by the shell.

inputs:
  mandate:
    description: >-
      Path to the mandate YAML, relative to the workspace. Pass this or
      approved-digest, not both.
    required: false
  approved-digest:
    description: >-
      Run the mandate `leastpilot review` posted with this digest instead of a file:
      the 64 hex characters from a `/leastpilot approve` comment. Needs `approval`,
      which serve checks before anything is minted (R5).
    required: false
  approval:
    description: >-
      The issue or pull request (owner/repo#number) where the requester approved
      this mandate. When set, nothing is minted without that approval.
    required: false
  ceiling:
    description: Path to the Cedar org ceiling policy.
    required: true
  schema:
    description: Path to the Cedar schema.
    required: true
  ceiling-destinations:
    description: >-
      Path to the ceiling's allowed-destination list. Required, and an empty
      file means no destination is permitted — which is the safe reading, not an
      oversight.
    required: true
  as:
    description: The GitHub login the mandate is requested by.
    required: true
  repo:
    description: >-
      Repository (owner/name) to read `as`'s permission from. Pass this or
      `level`, not both. This one makes the run an authorisation record.
    required: false
  level:
    description: >-
      Assert `as`'s permission level instead of reading it. Labelled unverified
      in the log.
    required: false
  agent:
    description: >-
      The agent command, ONE ARGUMENT PER LINE, with {mcpConfig} on its own line
      where the agent wants the MCP config path. For example:

        agent: |
          claude
          --mcp-config
          {mcpConfig}
          -p
          Fix issue 42 and open a pull request

      One element per line because a single string would have to be word-split,
      and nothing in a line is ever interpreted by the shell.
    required: true
  trace:
    description: Where to write the action graph (R8). Defaults to mandate-trace.jsonl.
    required: false
    default: mandate-trace.jsonl
  app-id:
    description: GitHub App id used to mint the agent's token.
    required: true
  installation-id:
    description: GitHub App installation id.
    required: true
  private-key:
    description: >-
      The App's private key (PKCS#1 PEM). Pass a secret, never a literal.
    required: true

outputs:
  trace:
    description: Path to the action graph the run recorded.
    value: ${{ steps.run.outputs.trace }}

runs:
  using: composite
  steps:
    - name: Refuse a GITHUB_TOKEN the agent could reach
      shell: bash
      run: |
        # The agent's authority must come from the minted token and nothing
        # else. A GITHUB_TOKEN in the environment is a second credential that no
        # mandate bounds, so this fails rather than enforcing a mandate it
        # cannot actually hold.
        if [ -n "${GITHUB_TOKEN:-}" ]; then
          echo "::error::GITHUB_TOKEN is set in this job. LeastPilot cannot bound an" \
               "agent that holds another credential. Set 'permissions: {}' on the" \
               "job and do not pass GITHUB_TOKEN to this action."
          exit 1
        fi

    # The published CLI, locked with every dependency in action-install/ and
    # installed with `npm ci`, then checked against the registry's signatures
    # and provenance (scripts/install-action-cli.sh).
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: Install LeastPilot
      id: cli
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/scripts/install-action-cli.sh"

    - name: Write the App key
      id: key
      shell: bash
      env:
        PRIVATE_KEY: ${{ inputs.private-key }}
      run: |
        set -euo pipefail
        dir="$(mktemp -d)"
        printf '%s\n' "$PRIVATE_KEY" > "$dir/app.pem"
        chmod 600 "$dir/app.pem"
        echo "path=$dir/app.pem" >> "$GITHUB_OUTPUT"

    - name: Validate the mandate and run the agent
      id: run
      shell: bash
      env:
        # Everything the script reads arrives here, as data. See note 2 above.
        LEASTPILOT_APP_ID: ${{ inputs.app-id }}
        LEASTPILOT_INSTALLATION_ID: ${{ inputs.installation-id }}
        LEASTPILOT_APP_KEY_PATH: ${{ steps.key.outputs.path }}
        IN_MANDATE: ${{ inputs.mandate }}
        IN_CEILING: ${{ inputs.ceiling }}
        IN_SCHEMA: ${{ inputs.schema }}
        IN_DESTINATIONS: ${{ inputs.ceiling-destinations }}
        IN_AS: ${{ inputs.as }}
        IN_REPO: ${{ inputs.repo }}
        IN_LEVEL: ${{ inputs.level }}
        IN_AGENT: ${{ inputs.agent }}
        IN_TRACE: ${{ inputs.trace }}
        IN_APPROVAL: ${{ inputs.approval }}
        IN_APPROVED_DIGEST: ${{ inputs.approved-digest }}
        LEASTPILOT_BIN: ${{ steps.cli.outputs.bin }}
      run: |
        set -euo pipefail

        authority=()
        if [ -n "$IN_REPO" ] && [ -n "$IN_LEVEL" ]; then
          echo "::error::Pass 'repo' or 'level', not both. They are two different" \
               "claims about where the requester's authority came from."
          exit 2
        elif [ -n "$IN_REPO" ]; then
          authority=(--repo "$IN_REPO")
        elif [ -n "$IN_LEVEL" ]; then
          authority=(--level "$IN_LEVEL")
        else
          echo "::error::Pass either 'repo' (read the level from GitHub) or 'level'" \
               "(assert it). There is no default: a run that has not said where the" \
               "requester's authority came from has not been asked the question."
          exit 2
        fi

        # One argv element per line. mapfile does not interpret the contents, so
        # a line containing ; or $( ) or a quote is an argument and not a command.
        agent=()
        while IFS= read -r line; do
          [ -n "$line" ] && agent+=("$line")
        done <<< "$IN_AGENT"
        if [ "${#agent[@]}" -eq 0 ]; then
          echo "::error::'agent' is empty. Give the agent command one argument per" \
               "line, with {mcpConfig} on its own line where it wants the config path."
          exit 2
        fi

        # A file, or the mandate `leastpilot review` posted and the requester
        # approved. Taken from a comment safely: serve re-derives the digest
        # from this file, the ceiling and the requester, so an altered mandate
        # does not match the approval and nothing is minted.
        mandate_file="$IN_MANDATE"
        if [ -n "$IN_MANDATE" ] && [ -n "$IN_APPROVED_DIGEST" ]; then
          echo "::error::Pass mandate or approved-digest, not both."
          exit 2
        elif [ -n "$IN_APPROVED_DIGEST" ]; then
          if [ -z "$IN_APPROVAL" ]; then
            echo "::error::approved-digest needs approval: the issue or pull request whose" \
                 "approval serve checks before anything is minted."
            exit 2
          fi
          mandate_file="$RUNNER_TEMP/mandate-approved.yaml"
          # The task goes to a file the agent is told to read, never into its
          # argv: it is the requester's comment, in the end.
          "$LEASTPILOT_BIN" reviewed \
            --on "$IN_APPROVAL" \
            --digest "$IN_APPROVED_DIGEST" \
            --out "$mandate_file" \
            --task-out "$GITHUB_WORKSPACE/.mandate-task.md"
        elif [ -z "$IN_MANDATE" ]; then
          echo "::error::Pass mandate (a file) or approved-digest (a reviewed mandate)."
          exit 2
        fi

        approval=()
        if [ -n "$IN_APPROVAL" ]; then
          approval=(--approval "$IN_APPROVAL")
        fi

        "$LEASTPILOT_BIN" run \
          --mandate "$mandate_file" \
          --ceiling "$IN_CEILING" \
          --schema "$IN_SCHEMA" \
          --ceiling-destinations "$IN_DESTINATIONS" \
          --as "$IN_AS" \
          "${authority[@]}" \
          --trace "$IN_TRACE" \
          "${approval[@]}" \
          --diff \
          -- "${agent[@]}"

        printf 'trace=%s\n' "$IN_TRACE" >> "$GITHUB_OUTPUT"

    - name: Shred the App key
      if: always()
      shell: bash
      env:
        KEY_PATH: ${{ steps.key.outputs.path }}
      run: rm -f "$KEY_PATH"

branding:
  icon: shield
  color: blue
